name: Release CodexTool

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          releaseName: "CodexTool ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}"
          releaseBody: |
            ## CodexTool 0.1.5

            - 重构 Skill 仓库：支持 skills.sh 榜单、搜索、Git 安装和本地启用/禁用管理。
            - 新增 Skill 详情卡片，直接读取仓库 SKILL.md 展示完整介绍。
            - 优化 Skill 下载链路，使用 GitHub HTTPS 定向下载并保留 Git 备用通道。
            - 完善中转账号编辑和 CodexTool 商城地址，保持 Windows 与 macOS 原有功能兼容。
          releaseDraft: false
          prerelease: false
          args: "--bundles nsis"

      - name: Package portable build
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $portable = Join-Path $PWD "release/CodexTool-$version-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/codextool.exe" -Destination (Join-Path $portable "CodexTool.exe")
          Copy-Item -LiteralPath "src-tauri/target/release/resources" -Destination (Join-Path $portable "resources") -Recurse
          Copy-Item -LiteralPath "README.md" -Destination $portable
          Copy-Item -LiteralPath "LICENSE" -Destination $portable
          Compress-Archive -LiteralPath $portable -DestinationPath "release/CodexTool-$version-portable.zip" -CompressionLevel Optimal

      - name: Upload portable build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.release_tag }}" } else { "${{ github.ref_name }}" }
          gh release upload $tag "release/CodexTool-$version-portable.zip" --clobber

  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable for Apple Silicon
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: macos-aarch64

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish macOS release
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          releaseName: "CodexTool ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}"
          releaseBody: |
            ## CodexTool 0.1.5

            - 重构 Skill 仓库：支持 skills.sh 榜单、搜索、Git 安装和本地启用/禁用管理。
            - 新增 Skill 详情卡片，直接读取仓库 SKILL.md 展示完整介绍。
            - 优化 Skill 下载链路，使用 GitHub HTTPS 定向下载并保留 Git 备用通道。
            - 完善中转账号编辑和 CodexTool 商城地址，保持 Windows 与 macOS 原有功能兼容。
          releaseDraft: false
          prerelease: false
          args: "--target aarch64-apple-darwin --bundles dmg"
